name: build-openmaic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository (patch files)
        uses: actions/checkout@v4

      - name: Checkout OpenMAIC v1.3.1 into subdirectory
        uses: actions/checkout@v4
        with:
          repository: THU-MAIC/OpenMAIC
          ref: v1.3.1
          path: openmaic-src

      - name: Apply gateway JWT auth patches
        run: |
          mkdir -p openmaic-src/lib/server/identity/host
          cp gateway-jwt.ts openmaic-src/lib/server/identity/host/gateway-jwt.ts
          node patch-instrumentation.js openmaic-src

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.28.0

      - name: Install dependencies
        working-directory: openmaic-src
        run: pnpm install
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build
        working-directory: openmaic-src
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Package standalone release
        working-directory: openmaic-src
        run: |
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp -a public release/public
          tar czf "$GITHUB_WORKSPACE/openmaic-v1.3.1-standalone.tar.gz" -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmaic-v1.3.1-standalone
          path: openmaic-v1.3.1-standalone.tar.gz
          retention-days: 7
